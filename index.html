<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UB-POP | Administração V6 — Catálogo PDF e Produtos</title>
<style>
:root{--navy:#10243a;--blue:#1769aa;--bg:#f3f6fa;--card:#fff;--text:#1c2938;--muted:#6b7888;--line:#e3e9f0;--green:#16845b;--orange:#b66a12}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--navy);color:white;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:800;letter-spacing:.5px;font-size:20px}.brand small{display:block;font-weight:400;font-size:11px;opacity:.75;letter-spacing:1.5px;margin-top:3px}
.layout{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 64px)}
nav{background:#fff;border-right:1px solid var(--line);padding:14px;overflow:auto}
nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:11px 12px;border-radius:8px;margin:2px 0;color:#35465a;font-size:14px;cursor:pointer}
nav button.active,nav button:hover{background:#eaf3fb;color:#125b96;font-weight:700}
main{padding:24px;max-width:1400px;width:100%;margin:auto}
h1{font-size:25px;margin:0 0 6px}h2{font-size:18px;margin:0 0 14px}.sub{color:var(--muted);font-size:13px;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:17px;box-shadow:0 2px 8px #10243a08}
.metric{font-size:27px;font-weight:800;margin:8px 0 3px}.muted{color:var(--muted);font-size:12px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:15px 0}
input,select,textarea{font:inherit;border:1px solid #ccd6e0;border-radius:8px;padding:10px;background:white;min-width:0}
input,select{height:40px}textarea{width:100%;min-height:80px}
button.primary{background:var(--blue);color:white;border:0;border-radius:8px;padding:10px 15px;font-weight:700;cursor:pointer}
button.secondary{background:white;color:#27415b;border:1px solid var(--line);border-radius:8px;padding:9px 13px;cursor:pointer}
button.danger{background:#fff1f0;color:#a33;border:1px solid #f2d0cc;border-radius:8px;padding:7px 10px;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600}
.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#e9f7f0;color:var(--green);font-size:11px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}.field input,.field select{width:100%}
.notice{background:#fff8e9;border:1px solid #f0dfb8;border-radius:10px;padding:13px;color:#76521c;font-size:13px;line-height:1.5}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.authbox{max-width:460px;margin:8vh auto;padding:24px}
.authbox h1{margin-bottom:8px}.authbox .field{margin:14px 0}.authbox input{width:100%}
.authmessage{margin-top:12px;color:#a33;font-size:13px;line-height:1.5}
#authArea{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px}
#authArea button{background:#fff;color:var(--navy);border:0;border-radius:7px;padding:7px 10px;font-weight:700;cursor:pointer}
@media(max-width:850px){.layout{display:block;grid-template-columns:1fr;min-height:0}nav{display:flex;flex-direction:column;align-items:stretch;flex-wrap:nowrap;overflow:visible;border-right:0;border-bottom:1px solid var(--line);gap:5px;min-height:0;height:auto;padding:10px 14px}nav button{display:block;flex:0 0 auto;white-space:normal;width:100%;height:auto;min-height:44px;margin:0;text-align:left;padding:12px 14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:16px;min-width:0}}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}header{padding:13px 16px;flex-wrap:wrap}header #authArea{max-width:100%;font-size:13px}}
#menuToggle{display:none;background:#fff;color:var(--navy);border:0;border-radius:8px;width:44px;height:44px;font-size:28px;line-height:1;cursor:pointer;box-shadow:0 1px 4px #0002}
@media(max-width:850px){
 #menuToggle{
   display:inline-flex;align-items:center;justify-content:center;
   position:fixed;left:12px;top:10px;z-index:1200;
   width:44px;height:44px;border-radius:10px;
   box-shadow:0 2px 8px #0003
 }
 header{padding-left:68px}
 #mainLayout #menu{
   display:flex;flex-direction:column;align-items:stretch;
   position:fixed;left:0;top:0;bottom:0;
   width:min(82vw,320px);height:100dvh;max-height:100dvh;
   overflow-y:auto;overflow-x:hidden;
   background:#fff;border-right:1px solid var(--line);
   border-bottom:0;box-shadow:8px 0 28px #0002;
   z-index:1100;padding:72px 14px 18px;
   transform:translateX(-105%);transition:transform .24s ease;
   visibility:hidden;pointer-events:none
 }
 #mainLayout.menu-visible #menu{
   transform:translateX(0);visibility:visible;pointer-events:auto
 }
 #mainLayout.menu-hidden #menu{
   transform:translateX(-105%);visibility:hidden;pointer-events:none
 }
}
</style>
</head>
<body>
<header>
  <div class="brand">UB-POP <small>PLATAFORMA DE PUBLICIDADE E CATÁLOGOS</small></div>
  <div id="authArea">Painel administrativo · V6 — QR Codes e interações</div>
  <button id="menuToggle" type="button" aria-label="Abrir ou ocultar menu" aria-expanded="false">⋮</button>
</header>
<div class="layout" id="mainLayout">
<nav id="menu">
<button class="active" data-page="inicio">▦ Visão geral</button>
<button data-page="anunciantes">♙ Anunciantes</button>
<button data-page="lojas">▣ Estabelecimentos</button>
<button data-page="segmentos">▤ Segmentos</button>
<button data-page="produtos">◇ Produtos e serviços</button>
<button data-page="campanhas">◉ Publicidade e campanhas</button>
<button data-page="grade">☷ Programação das telas</button>
<button data-page="midias">▣ Biblioteca de mídias</button>
<button data-page="regioes">⌖ Regiões</button>
<button data-page="veiculos">▣ Veículos e telas</button>
<button data-page="conteudos">▧ Conteúdos interativos</button>
<button data-page="encaminhamentos">↗ Encaminhamentos</button>
<button data-page="catalogos">▣ Gestão de Catálogos</button>
<button data-page="qrcodes">▦ QR Codes V6</button>
<button data-page="relatorios">▥ Relatórios</button>
<button data-page="usuarios">♧ Usuários e permissões</button>
</nav>
<main id="app"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/*
  UB-POP V2 — integração inicial.
  A chave publishable é própria para uso no navegador.
  Nunca coloque service_role/secret keys neste arquivo.
*/
const SUPABASE_URL = "https://hlkfygzkzswhclacpqcx.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_PlTz-XRXcxgVUx75sbJIdw_tUAeB85y";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const initial={
 anunciantes:[],lojas:[],segmentos:[{nome:"Restaurantes",status:"Ativo"},{nome:"Farmácias",status:"Ativo"},{nome:"Mercados",status:"Ativo"},{nome:"Vestuário",status:"Ativo"}],
 produtos:[],campanhas:[],regioes:[{nome:"Aparecida de Goiânia",estado:"GO"},{nome:"Goiânia",estado:"GO"}],
 veiculos:[],encaminhamentos:[],usuarios:[],grade:[
 {tipo:"Publicidade interativa",conteudo:"Anunciante A"},
 {tipo:"Publicidade simples",conteudo:"Anunciante B"},
 {tipo:"Conteúdo interativo",conteudo:"Previsão do tempo"},
 {tipo:"Catálogo central",conteudo:"Segmentos UB-POP"}
 ]};
let db=JSON.parse(localStorage.getItem("ubpop_demo_db")||"null")||initial;
["anunciantes","lojas","segmentos","produtos","campanhas","regioes","veiculos","encaminhamentos","usuarios","grade"].forEach(k=>{
 if(!Array.isArray(db[k])) db[k]=Array.isArray(initial[k]) ? [...initial[k]] : [];
});
const save=()=>localStorage.setItem("ubpop_demo_db",JSON.stringify(db));
const app=document.getElementById("app");
const menu=document.getElementById("menu");
const layout=document.getElementById("mainLayout");
const authArea=document.getElementById("authArea");
const titles={inicio:"Visão geral",anunciantes:"Anunciantes",lojas:"Estabelecimentos",segmentos:"Segmentos comerciais",produtos:"Produtos e serviços",campanhas:"Publicidade e campanhas",grade:"Programação central das telas",midias:"Biblioteca de mídias",regioes:"Gestão regional",veiculos:"Veículos e telas",conteudos:"Conteúdos interativos",encaminhamentos:"Encaminhamentos",catalogos:"Gestão de Catálogos",qrcodes:"QR Codes e interações V6",relatorios:"Relatórios",usuarios:"Usuários e permissões"};
let page="inicio";
let currentUser=null;
let authBusy=false;
let editingAdvertiserId=null;
let editingEstablishmentId=null;
let activeRegions=[];
let activeSegments=[];

function count(k){return db[k]?.length||0}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function showLogin(message=""){
 menu.style.display="none";
 layout.style.gridTemplateColumns="1fr";
 authArea.textContent="Acesso administrativo";
 app.innerHTML=`<div class="card authbox">
   <h1>Entrar na UB-POP</h1>
   <div class="sub">Acesso restrito ao administrador autorizado.</div>
   <form id="loginForm">
     <div class="field"><label for="loginEmail">E-mail</label><input id="loginEmail" name="email" type="email" autocomplete="username" required placeholder="Seu e-mail de administrador"></div>
     <div class="field"><label for="loginPassword">Senha</label><input id="loginPassword" name="password" type="password" autocomplete="current-password" required placeholder="Sua senha"></div>
     <button class="primary" id="loginButton" type="submit">Entrar</button>
     <div class="authmessage" id="loginMessage">${escapeHtml(message)}</div>
   </form>
 </div>`;
 document.getElementById("loginForm").onsubmit=login;
}

async function login(event){
 event.preventDefault();
 if(authBusy)return;
 authBusy=true;
 const button=document.getElementById("loginButton");
 const message=document.getElementById("loginMessage");
 button.disabled=true;button.textContent="Verificando...";
 message.textContent="";
 const email=document.getElementById("loginEmail").value.trim();
 const password=document.getElementById("loginPassword").value;
 const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
 authBusy=false;
 if(error){
   button.disabled=false;button.textContent="Entrar";
   message.textContent="Não foi possível entrar: "+error.message;
   return;
 }
 await verifyAdmin(data.user);
}

async function verifyAdmin(user){
 if(!user){
   currentUser=null;showLogin("Sessão não identificada. Entre novamente.");return;
 }
 const {data:profile,error}=await supabaseClient
   .from("profiles").select("id,full_name,role").eq("id",user.id).maybeSingle();
 if(error || !profile || profile.role!=="admin"){
   await supabaseClient.auth.signOut();
   currentUser=null;
   showLogin("Este usuário não possui perfil de administrador UB-POP. Verifique a conta cadastrada.");
   return;
 }
 currentUser={id:user.id,email:user.email,name:profile.full_name||user.email};
 authArea.innerHTML=`<span>Administrador: ${escapeHtml(currentUser.name)}</span><button id="logoutButton" type="button">Sair</button>`;
 document.getElementById("logoutButton").onclick=logout;
 menu.style.display="";
 layout.style.gridTemplateColumns="";
 await loadAdvertisers();
 await loadEstablishments();
 page="inicio";
 render();
}

async function logout(){
 await supabaseClient.auth.signOut();
 currentUser=null;
 db.anunciantes=[];
 showLogin("Você saiu do painel administrativo.");
}

async function loadAdvertisers(){
 if(!currentUser)return;
 db.anunciantes=[];
 const {data,error}=await supabaseClient
   .from("advertisers")
   .select("id,legal_name,trade_name,cnpj,contact_name,contact_email,phone,status,created_at")
   .order("created_at",{ascending:false});
 if(error){
   alert("Não foi possível carregar os anunciantes: "+error.message);
   return;
 }
 db.anunciantes=(data||[]).map(r=>({
   id:r.id,nome:r.trade_name,razao_social:r.legal_name||"",documento:r.cnpj||"",
   responsavel:r.contact_name||"",email:r.contact_email||"",contato:r.phone||"",
   status:r.status,created_at:r.created_at
 }));
}

async function renderAdvertisers(){
 app.innerHTML=`<h1>Anunciantes</h1>
 <div class="sub">Os registros desta área são consultados e salvos diretamente no Supabase.</div>
 <div class="card">
   <h2 id="advertiserFormTitle">Novo anunciante</h2>
   <form id="advertiserForm" class="formgrid">
     <div class="field"><label>Nome comercial *</label><input name="nome" required maxlength="160" placeholder="Nome usado pelo público"></div>
     <div class="field"><label>Razão social (opcional)</label><input name="razao_social" maxlength="180" placeholder="Razão social"></div>
     <div class="field"><label>CNPJ/CPF (opcional)</label><input name="documento" maxlength="30" placeholder="Documento"></div>
     <div class="field"><label>Responsável</label><input name="responsavel" maxlength="160" placeholder="Nome do responsável"></div>
     <div class="field"><label>Telefone/WhatsApp</label><input name="contato" maxlength="40" placeholder="Telefone com DDD"></div>
     <div class="field"><label>E-mail de contato</label><input name="email" type="email" maxlength="180" placeholder="contato@empresa.com"></div>
     <div class="field" style="grid-column:1/-1"><div class="actions"><button class="primary" id="saveAdvertiserButton" type="submit">Salvar no banco online</button><button class="secondary" id="cancelAdvertiserEdit" type="button" style="display:none">Cancelar edição</button></div></div>
   </form>
 </div>
 <div class="card" style="margin-top:16px">
   <div class="toolbar" style="justify-content:space-between"><h2 style="margin:0">Anunciantes cadastrados</h2><button class="secondary" id="refreshAdvertisers" type="button">Atualizar lista</button></div>
   <div id="advertiserTable"><div class="empty">Carregando registros...</div></div>
 </div>
 <div class="notice" style="margin-top:14px">Os novos registros recebem automaticamente a situação inicial “pending” no banco. A modalidade comercial ainda não é gravada porque a tabela atual não possui esse campo.</div>`;
 document.getElementById("advertiserForm").onsubmit=saveAdvertiser;
 document.getElementById("cancelAdvertiserEdit").onclick=cancelAdvertiserEdit;
 document.getElementById("refreshAdvertisers").onclick=async()=>{await loadAdvertisers();drawAdvertiserTable();};
 drawAdvertiserTable();
}

function drawAdvertiserTable(){
 const target=document.getElementById("advertiserTable");
 if(!target)return;
 const rows=db.anunciantes||[];
 if(!rows.length){target.innerHTML='<div class="empty">Nenhum anunciante cadastrado no banco online.</div>';return;}
 target.innerHTML=`<div style="overflow:auto"><table><thead><tr><th>Nome comercial</th><th>CNPJ/CPF</th><th>Responsável</th><th>Telefone</th><th>Situação</th><th>Ações</th></tr></thead><tbody>
 ${rows.map((r,i)=>`<tr><td>${escapeHtml(r.nome)}</td><td>${escapeHtml(r.documento||"—")}</td><td>${escapeHtml(r.responsavel||"—")}</td><td>${escapeHtml(r.contato||"—")}</td><td>${escapeHtml(r.status||"pending")}</td><td><div class="actions"><button class="secondary" type="button" onclick="editAdvertiser(${i})">Editar</button><button class="danger" type="button" onclick="deleteAdvertiser(${i})">Excluir</button></div></td></tr>`).join("")}
 </tbody></table></div>`;
}

function editAdvertiser(index){
 const item=db.anunciantes[index];
 if(!item?.id)return;
 const form=document.getElementById("advertiserForm");
 if(!form)return;
 editingAdvertiserId=item.id;
 form.elements.nome.value=item.nome||"";
 form.elements.razao_social.value=item.razao_social||"";
 form.elements.documento.value=item.documento||"";
 form.elements.responsavel.value=item.responsavel||"";
 form.elements.contato.value=item.contato||"";
 form.elements.email.value=item.email||"";
 document.getElementById("advertiserFormTitle").textContent="Editar anunciante";
 document.getElementById("saveAdvertiserButton").textContent="Salvar alterações no banco online";
 document.getElementById("cancelAdvertiserEdit").style.display="inline-block";
 form.scrollIntoView({behavior:"smooth",block:"start"});
}

function cancelAdvertiserEdit(){
 editingAdvertiserId=null;
 const form=document.getElementById("advertiserForm");
 if(form)form.reset();
 const title=document.getElementById("advertiserFormTitle");
 const button=document.getElementById("saveAdvertiserButton");
 const cancel=document.getElementById("cancelAdvertiserEdit");
 if(title)title.textContent="Novo anunciante";
 if(button)button.textContent="Salvar no banco online";
 if(cancel)cancel.style.display="none";
}

async function saveAdvertiser(event){
 event.preventDefault();
 if(!currentUser){showLogin("Entre novamente para continuar.");return;}
 const form=event.currentTarget;
 const button=document.getElementById("saveAdvertiserButton");
 const values=Object.fromEntries(new FormData(form).entries());
 const tradeName=values.nome.trim();
 if(!tradeName){alert("Informe o nome comercial.");return;}
 button.disabled=true;button.textContent=editingAdvertiserId?"Atualizando...":"Salvando...";
 const payload={
   trade_name:tradeName,
   legal_name:values.razao_social.trim()||null,
   cnpj:values.documento.trim()||null,
   contact_name:values.responsavel.trim()||null,
   contact_email:values.email.trim()||null,
   phone:values.contato.trim()||null
 };
 let result;
 if(editingAdvertiserId){
   result=await supabaseClient.from("advertisers").update(payload).eq("id",editingAdvertiserId);
 }else{
   result=await supabaseClient.from("advertisers").insert(payload);
 }
 button.disabled=false;
 if(result.error){
   button.textContent=editingAdvertiserId?"Salvar alterações no banco online":"Salvar no banco online";
   alert("O Supabase não aceitou a operação. Detalhe: "+result.error.message);
   return;
 }
 const wasEditing=Boolean(editingAdvertiserId);
 cancelAdvertiserEdit();
 await loadAdvertisers();
 drawAdvertiserTable();
 alert(wasEditing?"Alterações salvas no banco online com sucesso.":"Anunciante salvo no banco online com sucesso.");
}

async function deleteAdvertiser(index){
 const item=db.anunciantes[index];
 if(!item?.id)return;
 if(!confirm("Excluir o anunciante "+item.nome+" do banco online?"))return;
 const {error}=await supabaseClient.from("advertisers").delete().eq("id",item.id);
 if(error){alert("Não foi possível excluir: "+error.message);return;}
 await loadAdvertisers();
 drawAdvertiserTable();
 alert("Anunciante excluído do banco online.");
}

async function loadEstablishments(){
 if(!currentUser)return;
 const [estRes,regRes,segRes]=await Promise.all([
  supabaseClient.from("establishments").select("id,advertiser_id,region_id,segment_id,name,address,phone,whatsapp,instagram,website,sales_channel_type,sales_channel_url,status,created_at").order("created_at",{ascending:false}),
  supabaseClient.from("regions").select("id,name,city,state,active").eq("active",true).order("name"),
  supabaseClient.from("segments").select("id,name,description,active").eq("active",true).order("name")
 ]);
 if(estRes.error){alert("Não foi possível carregar os estabelecimentos: "+estRes.error.message);return;}
 if(regRes.error){alert("Não foi possível carregar as regiões: "+regRes.error.message);return;}
 if(segRes.error){alert("Não foi possível carregar os segmentos: "+segRes.error.message);return;}
 activeRegions=regRes.data||[];
 activeSegments=segRes.data||[];
 db.lojas=(estRes.data||[]).map(r=>({
  id:r.id,advertiser_id:r.advertiser_id,region_id:r.region_id,segment_id:r.segment_id,
  nome:r.name,endereco:r.address||"",telefone:r.phone||"",whatsapp:r.whatsapp||"",
  instagram:r.instagram||"",site:r.website||"",sales_channel_type:r.sales_channel_type||"",sales_channel_url:r.sales_channel_url||"",status:r.status||"pending"
 }));
}

async function renderEstablishments(){
 await loadEstablishments();
 const advertiserOptions=(db.anunciantes||[]).map(a=>`<option value="${escapeHtml(a.id)}">${escapeHtml(a.nome)}</option>`).join("");
 const regionOptions=activeRegions.map(r=>`<option value="${escapeHtml(r.id)}">${escapeHtml(r.name)}${r.city?" — "+escapeHtml(r.city):""}${r.state?"/"+escapeHtml(r.state):""}</option>`).join("");
 const segmentOptions=activeSegments.map(r=>`<option value="${escapeHtml(r.id)}">${escapeHtml(r.name)}</option>`).join("");
 app.innerHTML=`<h1>Estabelecimentos</h1>
 <div class="sub">Cadastro conectado ao Supabase. Cada estabelecimento precisa estar vinculado a um anunciante.</div>
 <div class="card"><h2 id="establishmentFormTitle">Novo estabelecimento</h2>
 <form id="establishmentForm" class="formgrid">
  <div class="field"><label>Anunciante responsável *</label><select name="advertiser_id" required><option value="">Selecione um anunciante</option>${advertiserOptions}</select></div>
  <div class="field"><label>Nome do estabelecimento *</label><input name="nome" required maxlength="180" placeholder="Nome da loja ou unidade"></div>
  <div class="field"><label>Região (opcional)</label><select name="region_id"><option value="">Sem região definida</option>${regionOptions}</select></div>
  <div class="field"><label>Segmento (opcional)</label><select name="segment_id"><option value="">Sem segmento definido</option>${segmentOptions}</select></div>
  <div class="field"><label>Endereço</label><input name="endereco" maxlength="240" placeholder="Endereço completo"></div>
  <div class="field"><label>Telefone</label><input name="telefone" maxlength="40" placeholder="Telefone com DDD"></div>
  <div class="field"><label>WhatsApp</label><input name="whatsapp" maxlength="40" placeholder="WhatsApp com DDD"></div>
  <div class="field"><label>Instagram</label><input name="instagram" maxlength="160" placeholder="@perfil ou link"></div>
  <div class="field"><label>Site ou catálogo externo</label><input name="site" type="url" maxlength="500" placeholder="https://"></div>
  <div class="field"><label>Tipo do canal de venda</label><select name="sales_channel_type"><option value="">Não configurado</option><option value="whatsapp">WhatsApp</option><option value="website">Website</option><option value="app">Aplicativo</option><option value="other">Outro</option></select></div>
  <div class="field"><label>Endereço HTTPS do canal de venda</label><input name="sales_channel_url" type="url" maxlength="500" placeholder="https://..."></div>

}

async function createCatalog(event){
 event.preventDefault();
 if(!currentUser){showLogin("Entre novamente para continuar.");return;}

 if(!values.establishment_id||!values.name.trim()){alert("Selecione o estabelecimento e informe o nome do catálogo.");return;}

 try{

async function uploadCatalogFiles(catalogId,files,productId,assetType){
 const created=[];
 for(const file of files){
  if(file.size>20971520)throw new Error("O arquivo "+file.name+" ultrapassa 20 MB.");
  const allowed=["application/pdf","image/jpeg","image/png","image/webp","image/avif"];
  if(!allowed.includes(file.type))throw new Error("Formato não permitido: "+file.name);
  const cleanName=file.name.normalize("NFKD").replace(/[^a-zA-Z0-9._-]+/g,"_").replace(/^_+|_+$/g,"").slice(-100)||"arquivo";
  const path=catalogId+"/"+Date.now()+"_"+crypto.randomUUID()+"_"+cleanName;
  const {error:uploadError}=await supabaseClient.storage.from("ubpop-catalogs").upload(path,file,{contentType:file.type,upsert:false});
  if(uploadError)throw uploadError;
  const {data:asset,error:assetError}=await supabaseClient.from("catalog_assets").insert({catalog_id:catalogId,product_id:productId||null,asset_type:assetType,storage_bucket:"ubpop-catalogs",storage_path:path,original_file_name:file.name,mime_type:file.type,file_size_bytes:file.size,created_by:currentUser.id}).select("id").single();
  if(assetError)throw assetError;
  created.push(asset);
  if(productId&&assetType==="product_image"){
   const {error:linkError}=await supabaseClient.from("products").update({image_asset_id:asset.id}).eq("id",productId).eq("catalog_id",catalogId);
   if(linkError)throw linkError;
  }
 }
 return created;
}

  supabaseClient.from("establishments").select("id,name"),
  supabaseClient.from("products").select("id,catalog_id,name,description,price,purchase_url,active,image_asset_id,image_url").not("catalog_id","is",null).order("name"),

 ]);

  ${as.length?`<ul>${as.map(a=>`<li class="muted">${escapeHtml(a.original_file_name||a.asset_type)} · ${escapeHtml(a.asset_type)}</li>`).join("")}</ul>`:""}
  <div class="actions" style="margin-top:10px">${c.status==="draft"?`<button class="secondary" type="button" onclick="submitCatalogApproval('${c.id}')">Enviar para aprovação</button>`:""}${c.status==="pending_approval"?`<button class="secondary" type="button" onclick="approveCatalog('${c.id}')">Aprovar</button>`:""}${c.status==="approved"?`<button class="primary" type="button" onclick="publishCatalog('${c.id}')">Programar exibição</button>`:""}${c.status!=="archived"?`<button class="secondary" type="button" onclick="showCatalogProductForm('${c.id}')">Adicionar produto</button><button class="secondary" type="button" onclick="showCatalogUploadForm('${c.id}')">Enviar arquivos</button><button class="primary" type="button" onclick="showCatalogPdfImport('${c.id}')">Importar PDF e extrair produtos</button><button class="secondary" type="button" onclick="showCatalogVisualSettings('${c.id}')">Configurar imagens do catálogo</button><button class="danger" type="button" onclick="archiveCatalog('${c.id}')">Arquivar</button>`:""}</div>
  <div id="catalog-extra-${c.id}" style="margin-top:10px"></div>

 }).join("");

async function extractPdfTextInBrowser(file){
 if(!window.pdfjsLib){await new Promise((resolve,reject)=>{const script=document.createElement("script");script.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";script.onload=resolve;script.onerror=()=>reject(new Error("Não foi possível carregar o leitor PDF. Verifique a conexão e tente novamente."));document.head.appendChild(script);});}
 if(!window.pdfjsLib)throw new Error("Leitor PDF indisponível.");
 window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
 const bytes=await file.arrayBuffer(),pdf=await window.pdfjsLib.getDocument({data:bytes}).promise;let pages=[],all=[];
 for(let n=1;n<=pdf.numPages;n++){const page=await pdf.getPage(n),content=await page.getTextContent();const lines=[];let lastY=null,line="";for(const item of content.items){if(!item.str)continue;const y=Math.round(item.transform?.[5]||0);if(lastY!==null&&Math.abs(y-lastY)>3){if(line.trim())lines.push(line.trim());line="";}line+=(item.str.endsWith(" ")?item.str:item.str+" ");lastY=y;}if(line.trim())lines.push(line.trim());pages.push(lines.join("\n"));all.push(...lines);}
 return {pages:pdf.numPages,text:all.join("\n"),pageText:pages};
}

function parsePdfProductCandidates(pdfText){
 const lines=pdfText.split(/\r?\n/).map(x=>x.replace(/\s+/g," ").trim()).filter(Boolean);const found=[];const priceRe=/(?:R\$\s*)?\d{1,4}(?:[.,]\d{2})\b/g;
 for(let i=0;i<lines.length;i++){
  const line=lines[i];const matches=[...line.matchAll(priceRe)];if(!matches.length)continue;
  const m=matches[matches.length-1];let rawPrice=m[0].replace(/R\$\s*/i,"").trim();if(rawPrice.includes(",")){rawPrice=rawPrice.replace(/\./g,"").replace(",",".");}const price=Number(rawPrice);if(!Number.isFinite(price)||price<0||price>100000)continue;
  let name=line.slice(0,m.index).replace(/[|•·\-–—:]+$/g,"").trim();if(!name&&i>0)name=lines[i-1];
  name=name.replace(/^(?:R\$\s*)/i,"").trim();if(name.length<2||name.length>160)continue;
  if(/^(total|subtotal|desconto|frete|página|pagina|validade|preço|preco)$/i.test(name))continue;
  const key=name.toLowerCase();if(found.some(x=>x.name.toLowerCase()===key&&x.price===price))continue;
  found.push({name:name.slice(0,160),description:null,price,purchase_url:null,selected:true,source_line:line});
 }
 return found.slice(0,250);
}

 button.disabled=true;button.textContent="Gerando...";result.innerHTML='<div class="muted">Validando permissões e criando token seguro...</div>';
 try{

  const qrBox=document.getElementById("qrCanvasBox");

  document.getElementById("printQrCode").onclick=()=>{const qr=qrBox.querySelector("img");if(!qr||!qr.complete){alert("A imagem do QR Code ainda não foi carregada.");return;}const w=window.open("","_blank");if(!w){alert("Permita pop-ups para imprimir o QR Code.");return;}const src=qr.src;w.document.write(`<html><head><title>UB-POP QR Code</title></head><body style="font-family:Arial;text-align:center;padding:24px"><h2>UB-POP</h2><img src="${src}" style="width:280px;height:280px"><p>QR Code de redirecionamento</p></body></html>`);w.document.close();w.focus();w.print();};
  await loadQrEvents();

async function loadReports(){

 const {data,error}=await supabaseClient.from('ubpop_admin_interaction_report_v6_test').select('*').order('report_date',{ascending:false}).limit(5000);
 if(error){status.textContent='Não foi possível carregar o relatório: '+error.message;document.getElementById('repMetrics').innerHTML='';document.getElementById('repTable').innerHTML='<div class="notice">Verifique as permissões de leitura da visão de relatórios no Supabase.</div>';return;}
 reportRows=data||[];
 const estSel=document.getElementById('repEst');

function filteredReportRows(){
 const from=document.getElementById('repFrom')?.value||'';
 const to=document.getElementById('repTo')?.value||'';
 const est=document.getElementById('repEst')?.value||'';
 return reportRows.filter(x=>(!from||x.report_date>=from)&&(!to||x.report_date<=to)&&(!est||x.establishment_id===est));
}
function drawReports(){
 const rows=filteredReportRows();
 const sum=k=>rows.reduce((a,x)=>a+(Number(x[k])||0),0);
 const metrics=[['Aberturas de catálogo',sum('catalog_opens')],['Leituras de QR Code',sum('qr_scans')],['Redirecionamentos concluídos',sum('completed_redirects')],['Tokens distintos lidos',sum('unique_qr_tokens_scanned')]];
 document.getElementById('repMetrics').innerHTML=metrics.map(([n,v])=>`<div class="card"><div class="muted">${n}</div><div class="metric">${v.toLocaleString('pt-BR')}</div><div class="muted">Eventos registrados</div></div>`).join('');

 if(!rows.length){target.innerHTML='<div class="empty">Nenhum evento encontrado para os filtros selecionados.</div>';return;}
 target.innerHTML=`<div style="overflow:auto"><table><thead><tr><th>Data</th><th>Anunciante</th><th>Campanha</th><th>Veículo</th><th>Tela</th><th>Produto</th><th>Destino</th><th>Aberturas</th><th>Leituras QR</th><th>Redirecionamentos</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${escapeHtml(x.report_date||'—')}</td><td>${escapeHtml(x.establishment_name||'—')}</td><td>${escapeHtml(x.campaign_name||'—')}</td><td>${escapeHtml(x.vehicle_name||'—')}</td><td>${escapeHtml(x.screen_name||'—')}</td><td>${escapeHtml(x.product_name||'—')}</td><td>${escapeHtml(x.destination_type||'—')}</td><td>${Number(x.catalog_opens)||0}</td><td>${Number(x.qr_scans)||0}</td><td>${Number(x.completed_redirects)||0}</td></tr>`).join('')}</tbody></table></div>`;
}
function exportReportsCsv(){
 const rows=filteredReportRows(); if(!rows.length){alert('Não há dados para exportar.');return;}
 const cols=[['report_date','Data'],['establishment_name','Anunciante'],['campaign_name','Campanha'],['vehicle_name','Veículo'],['screen_name','Tela'],['product_name','Produto'],['destination_type','Destino'],['catalog_opens','Aberturas de catálogo'],['qr_scans','Leituras QR'],['completed_redirects','Redirecionamentos']];
 const esc=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const csv='\ufeff'+[cols.map(x=>esc(x[1])).join(';'),...rows.map(r=>cols.map(x=>esc(r[x[0]])).join(';'))].join('\r\n');
 const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));const a=document.createElement('a');a.href=url;a.download='ubpop-relatorio-v6.csv';a.click();URL.revokeObjectURL(url);
}

async function renderMediaLibrary(message=""){
 if(!currentUser){showLogin();return;}
 app.innerHTML=`<h1>Biblioteca de mídias</h1>
 <div class="sub">Arquivos do bucket privado ubpop-media. Somente administrador autenticado pode enviar e administrar.</div>
 ${message?`<div class="notice" style="margin-bottom:14px">${escapeHtml(message)}</div>`:""}
 <div class="notice" style="margin-bottom:16px"><b>Padrão recomendado para vídeos:</b> MP4, H.264 Baseline/Main, 30 fps, 16:9 horizontal ou vertical conforme a campanha; áudio AAC-LC. Esta primeira versão faz upload e cadastro, mas ainda não converte automaticamente nem analisa o codec internamente. Envie os arquivos já convertidos e testados.</div>
 <div class="card"><h2>Enviar nova mídia</h2>
 <form id="mediaUploadForm">
 <div class="formgrid">
 <div class="field"><label for="mediaName">Nome da mídia</label><input id="mediaName" name="name" required maxlength="120" placeholder="Ex.: MayCup — vídeo vertical"></div>
 <div class="field"><label for="mediaFile">Arquivo (MP4 ou imagem)</label><input id="mediaFile" name="file" type="file" accept="video/mp4,.mp4,image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" required></div>
 </div>
 <div id="mediaLocalPreview" style="margin:12px 0"></div>
 <div class="toolbar"><button class="primary" id="mediaUploadButton" type="submit">Enviar para biblioteca</button><span class="muted">Vídeo MP4 até 200 MB; imagem até 20 MB.</span></div>
 <div id="mediaUploadStatus" class="authmessage" role="status"></div>
 </form></div>
 <div class="card" style="margin-top:16px"><div class="toolbar" style="justify-content:space-between"><h2 style="margin:0">Mídias cadastradas</h2><button class="secondary" id="mediaRefreshButton" type="button">Atualizar lista</button></div>
 <div id="mediaTable"><div class="empty">Carregando mídias…</div></div>
 <div id="mediaPreview" style="margin-top:14px"></div></div>`;
 const form=document.getElementById('mediaUploadForm');
 const fileInput=document.getElementById('mediaFile');
 fileInput.onchange=()=>{
  const file=fileInput.files?.[0];const holder=document.getElementById('mediaLocalPreview');
  if(!file){holder.innerHTML='';return;}
  const url=URL.createObjectURL(file);
  if(file.type.startsWith('video/')) holder.innerHTML=`<video controls playsinline style="width:100%;max-width:420px;max-height:320px;border-radius:10px;background:#000" src="${url}"></video><div class="muted">Prévia local · ${escapeHtml(file.name)} · ${(file.size/1048576).toFixed(1)} MB</div>`;
  else if(file.type.startsWith('image/')) holder.innerHTML=`<img alt="Prévia da imagem" style="max-width:100%;max-height:240px;border-radius:10px" src="${url}"><div class="muted">Prévia local · ${escapeHtml(file.name)} · ${(file.size/1048576).toFixed(1)} MB</div>`;
  else holder.innerHTML=`<div class="notice">Formato não reconhecido. Selecione MP4, JPG, PNG ou WebP.</div>`;
 };
 document.getElementById('mediaRefreshButton').onclick=()=>loadMediaLibrary();
 form.onsubmit=async e=>{
  e.preventDefault();
  const button=document.getElementById('mediaUploadButton');const status=document.getElementById('mediaUploadStatus');
  const name=document.getElementById('mediaName').value.trim();const file=fileInput.files?.[0];
  if(!name||!file){status.textContent='Informe o nome e escolha um arquivo.';return;}
  const isVideo=file.type==='video/mp4'||file.name.toLowerCase().endsWith('.mp4');
  const isImage=['image/jpeg','image/png','image/webp'].includes(file.type)||/\.(jpe?g|png|webp)$/i.test(file.name);
  if(!isVideo&&!isImage){status.textContent='Formato não aceito. Use MP4, JPG, PNG ou WebP.';return;}
  const limit=isVideo?200*1024*1024:20*1024*1024;
  if(file.size>limit){status.textContent=`Arquivo acima do limite de ${(limit/1048576)} MB.`;return;}
  const mime=isVideo?'video/mp4':(file.type||'image/jpeg');
  button.disabled=true;button.textContent='Enviando…';status.textContent='Enviando arquivo e registrando mídia…';
  let storagePath=null;
  try{
   const safeName=file.name.normalize('NFKD').replace(/[^\w.-]+/g,'_').slice(-100)||'media';
   const day=new Date().toISOString().slice(0,10);
   storagePath=`${day}/${crypto.randomUUID()}-${safeName}`;
   const {error:uploadError}=await supabaseClient.storage.from('ubpop-media').upload(storagePath,file,{contentType:mime,upsert:false});
   if(uploadError)throw uploadError;
   const metadata={name,storage_bucket:'ubpop-media',storage_path:storagePath,asset_type:isVideo?'video':'image',mime_type:mime,file_size_bytes:file.size,duration_seconds:null,active:true};
   if(isVideo){
    try{const url=URL.createObjectURL(file);const duration=await new Promise(resolve=>{const v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=()=>{resolve(Number.isFinite(v.duration)?Math.round(v.duration):null);URL.revokeObjectURL(url);};v.onerror=()=>{resolve(null);URL.revokeObjectURL(url);};v.src=url;});metadata.duration_seconds=duration;}catch{}
   }
   const {error:insertError}=await supabaseClient.from('media_assets').insert(metadata);
   if(insertError){await supabaseClient.storage.from('ubpop-media').remove([storagePath]);storagePath=null;throw insertError;}
   form.reset();document.getElementById('mediaLocalPreview').innerHTML='';
   await loadMediaLibrary();
   alert('Mídia enviada e cadastrada na Biblioteca.');
  }catch(err){status.textContent='Não foi possível enviar: '+(err?.message||'erro desconhecido');}
  finally{button.disabled=false;button.textContent='Enviar para biblioteca';}
 };
 await loadMediaLibrary();
}

 target.innerHTML='<div class="empty">Atualizando lista…</div>';

}

window.ubpopPreviewMedia=async function(id,type){

window.ubpopReplaceMedia=async function(id,type){
 const current=await supabaseClient.from('media_assets').select('id,name,storage_bucket,storage_path,asset_type').eq('id',id).maybeSingle();
 if(current.error||!current.data){alert('Não foi possível localizar a mídia para substituição.');return;}
 const old=current.data;
 const picker=document.createElement('input');picker.type='file';
 picker.accept=type==='video'?'video/mp4,.mp4':'image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp';
 picker.onchange=async()=>{
  const file=picker.files?.[0];if(!file)return;
  const isVideo=type==='video';
  const valid=isVideo?(file.type==='video/mp4'||/\.mp4$/i.test(file.name)):(['image/jpeg','image/png','image/webp'].includes(file.type)||/\.(jpe?g|png|webp)$/i.test(file.name));
  const limit=isVideo?200*1024*1024:20*1024*1024;
  if(!valid){alert(isVideo?'Escolha um vídeo MP4.':'Escolha uma imagem JPG, PNG ou WebP.');return;}
  if(file.size>limit){alert(`Arquivo acima do limite de ${(limit/1048576)} MB.`);return;}
  if(!confirm(`Substituir o arquivo de "${old.name}"? A programação continuará usando o mesmo cadastro de mídia.`))return;
  const safeName=file.name.normalize('NFKD').replace(/[^\w.-]+/g,'_').slice(-100)||'media';
  const day=new Date().toISOString().slice(0,10);const newPath=`${day}/${crypto.randomUUID()}-${safeName}`;
  const mime=isVideo?'video/mp4':(file.type||'image/jpeg');
  try{
   const {error:uploadError}=await supabaseClient.storage.from(old.storage_bucket).upload(newPath,file,{contentType:mime,upsert:false});
   if(uploadError)throw uploadError;
   const updates={storage_path:newPath,mime_type:mime,file_size_bytes:file.size};
   if(isVideo){updates.duration_seconds=await new Promise(resolve=>{const url=URL.createObjectURL(file);const v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=()=>{const d=Number.isFinite(v.duration)?Math.round(v.duration):null;URL.revokeObjectURL(url);resolve(d);};v.onerror=()=>{URL.revokeObjectURL(url);resolve(null);};v.src=url;});}
   else updates.duration_seconds=null;
   const {error:updateError}=await supabaseClient.from('media_assets').update(updates).eq('id',id);
   if(updateError){await supabaseClient.storage.from(old.storage_bucket).remove([newPath]);throw updateError;}
   if(old.storage_path&&old.storage_path!==newPath)await supabaseClient.storage.from(old.storage_bucket).remove([old.storage_path]);
   await loadMediaLibrary();alert('Arquivo substituído com sucesso.');
  }catch(err){alert('Não foi possível substituir o arquivo: '+(err?.message||'erro desconhecido'));}
 };
 picker.click();
};

 if(page==="qrcodes"){renderQrManagement();return;}
 if(page==="midias"){renderMediaLibrary();return;}
 if(page==="grade"){app.innerHTML=`<h1>${titles[page]}</h1><div class="sub">Uma estrutura de grade compartilhada. Os conteúdos regionais serão carregados conforme a região do veículo.</div><div class="card"><h2>Sequência de exibição</h2><div id="gradeRows">${db.grade.map((g,i)=>`<div style="display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:12px 0"><b>${String(i+1).padStart(2,'0')}</b><div style="flex:1"><b>${g.tipo}</b><div class="muted">${g.conteudo}</div></div><div class="actions"><button class="secondary" onclick="moveGrade(${i},-1)">↑</button><button class="secondary" onclick="moveGrade(${i},1)">↓</button><button class="danger" onclick="removeGrade(${i})">Excluir</button></div></div>`).join('')}</div><div class="toolbar"><select id="gt"><option>Publicidade interativa</option><option>Publicidade simples</option><option>Conteúdo interativo</option><option>Catálogo central</option></select><input id="gc" placeholder="Nome do conteúdo"><button class="primary" onclick="addGrade()">Adicionar à grade</button></div><button class="primary" onclick="save();alert('Grade salva neste protótipo.')">Salvar grade</button></div>`;return;}
 if(page==="conteudos"){app.innerHTML=`<h1>${titles[page]}</h1><div class="sub">Ativação e configuração dos módulos de informação.</div><div class="grid">${['Previsão do tempo','Notícias','Futebol','Resultados de loterias'].map((n)=>`<div class="card"><b>${n}</b><p class="muted">Fonte externa e atualização automática ainda precisam ser configuradas.</p><label><input type="checkbox" checked> Ativar módulo</label></div>`).join('')}</div><div class="notice">O protótipo não consulta fontes externas nem publica notícias ou resultados. Essas integrações serão configuradas e testadas na etapa de backend.</div>`;return;}
 if(page==="relatorios"){renderReports();return;}
 const configs={
 lojas:{label:"estabelecimentos",fields:[["nome","Nome do estabelecimento"],["segmento","Segmento"],["regiao","Região"],["whatsapp","WhatsApp"],["instagram","Instagram"],["link","Site ou catálogo externo"]]},
 segmentos:{label:"segmentos",fields:[["nome","Nome do segmento"]]},
 produtos:{label:"produtos e serviços",fields:[["nome","Nome do produto/serviço"],["loja","Estabelecimento"],["preco","Preço (opcional)"],["descricao","Descrição"],["link","Link comercial"]]},
 campanhas:{label:"campanhas",fields:[["nome","Nome da campanha"],["anunciante","Anunciante"],["tipo","Tipo",["Publicidade interativa","Publicidade simples","Institucional"]],["inicio","Data de início"],["fim","Data de encerramento"],["destino","Destino do toque"]]},
 regioes:{label:"regiões",fields:[["nome","Nome da região"],["estado","Estado"]]},
 veiculos:{label:"veículos e telas",fields:[["identificacao","Identificação do veículo"],["regiao","Região"],["tela","Identificação da tela"],["status","Situação",["Ativo","Inativo"]]]},
 encaminhamentos:{label:"encaminhamentos",fields:[["loja","Estabelecimento"],["origem","Origem/campanha"],["data","Data"],["situacao","Situação",["Registrado","Venda confirmada","Cancelado"]]]},
 usuarios:{label:"usuários e permissões",fields:[["nome","Nome"],["email","E-mail"],["perfil","Perfil",["Administrador","Operacional","Comercial","Financeiro","Conteúdo"]]]}
 };
 const c=configs[page];if(!c){app.innerHTML="<div class='notice'>Área ainda não configurada.</div>";return;}
 const rows=db[page]||[];
 app.innerHTML=`<h1>${titles[page]}</h1><div class="sub">Cadastre e administre ${c.label} em um único painel.</div><div class="card"><h2>Novo cadastro</h2><form id="form" class="formgrid">${c.fields.map(f=>`<div class="field"><label>${f[1]}</label>${f[2]?`<select name="${f[0]}">${f[2].map(o=>`<option>${o}</option>`).join('')}</select>`:`<input name="${f[0]}" ${f[0]==='preco'?'type="number" step="0.01"':''} ${f[0]==='inicio'||f[0]==='fim'||f[0]==='data'?'type="date"':''} placeholder="${f[1]}" ${f[0]==='nome'?'required':''}>`}</div>`).join('')}<div class="field" style="grid-column:1/-1"><button class="primary">Salvar cadastro</button></div></form></div><div class="card" style="margin-top:16px"><h2>Registros cadastrados (${rows.length})</h2>${rows.length?`<div style="overflow:auto"><table><thead><tr>${c.fields.slice(0,4).map(f=>`<th>${f[1]}</th>`).join('')}<th>Ações</th></tr></thead><tbody>${rows.map((r,i)=>`<tr>${c.fields.slice(0,4).map(f=>`<td>${escapeHtml(r[f[0]]||'—')}</td>`).join('')}<td><button class="danger" onclick="del('${page}',${i})">Excluir</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Nenhum registro cadastrado.</div>`}</div>`;
 document.getElementById("form").onsubmit=e=>{
  e.preventDefault();
  const obj=Object.fromEntries(new FormData(e.target).entries());
  if(!Array.isArray(db[page])) db[page]=[];
  db[page].push(obj);
  try { save(); render(); alert("Cadastro salvo neste protótipo local."); }
  catch(err) { db[page].pop(); alert("Não foi possível salvar neste navegador. Verifique o espaço disponível e tente novamente."); }
 };
}

function del(p,i){if(confirm('Excluir este registro?')){db[p].splice(i,1);save();render();}}
function addGrade(){let t=document.getElementById('gt').value,c=document.getElementById('gc').value.trim();if(!c){alert('Informe o nome do conteúdo.');return;}db.grade.push({tipo:t,conteudo:c});save();render();}
function removeGrade(i){db.grade.splice(i,1);save();render();}
function moveGrade(i,d){let j=i+d;if(j<0||j>=db.grade.length)return;[db.grade[i],db.grade[j]]=[db.grade[j],db.grade[i]];save();render();}
const mainLayout=document.getElementById("mainLayout");
const menuToggle=document.getElementById("menuToggle");
if(menuToggle){
  if(window.matchMedia("(max-width:850px)").matches){
    mainLayout.classList.add("menu-hidden");
    menuToggle.setAttribute("aria-expanded","false");
  }
  menuToggle.addEventListener("click",()=>{
    const isVisible=mainLayout.classList.toggle("menu-visible");
    mainLayout.classList.toggle("menu-hidden",!isVisible);
    menuToggle.setAttribute("aria-expanded",String(isVisible));
  });
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  page=b.dataset.page;
  render();
  if(window.matchMedia("(max-width:850px)").matches){
    mainLayout.classList.remove("menu-visible");
    mainLayout.classList.add("menu-hidden");
    menuToggle?.setAttribute("aria-expanded","false");
  }
});

async function startApp(){
 const {data,error}=await supabaseClient.auth.getSession();
 if(error){showLogin("Não foi possível verificar a sessão: "+error.message);return;}
 if(data.session){await verifyAdmin(data.session.user);}
 else{showLogin();}
}
startApp();
</script>
</body>
</html>
